# Goblin Recon third-party integration registry.
# Keep integrations disabled until company/admin approval is complete.

integrations:
  brave_search_api:
    enabled: false
    approval_required: true
    purpose: "Speed up public web search for source discovery and verification."
    env_vars:
      - BRAVE_SEARCH_API_KEY
    recommended_scope: "Read-only public web search"
    avoid: "Storing search keys in chat, source files, or committed config"

  google_custom_search_api:
    enabled: false
    approval_required: true
    purpose: "Fallback public web search provider when Brave Search is not available."
    env_vars:
      - GOOGLE_CUSTOM_SEARCH_API_KEY
      - GOOGLE_CUSTOM_SEARCH_ENGINE_ID
    recommended_scope: "Read-only public web search"
    avoid: "Storing search keys in chat, source files, or committed config"

  youtube_data_api:
    enabled: false
    approval_required: true
    purpose: "Read public video/channel metadata when transcript-only access is not enough."
    env_vars:
      - YOUTUBE_API_KEY
    recommended_scope: "Read-only public metadata"
    avoid: "Upload, delete, edit, or manage channel permissions"

  x_twitter_api:
    enabled: false
    approval_required: true
    purpose: "Read public trend/search data from X/Twitter."
    env_vars:
      - X_BEARER_TOKEN
    recommended_scope: "Read-only search/recent posts"
    avoid: "Posting, deleting posts, DM access, account management"

  reddit_api:
    enabled: false
    approval_required: true
    purpose: "Read public subreddit posts and comments."
    env_vars:
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - REDDIT_USER_AGENT
    recommended_scope: "Read-only public data"
    avoid: "Private messages, moderation, posting, voting"

  instagram_meta_api:
    enabled: false
    approval_required: true
    purpose: "Read approved public/business account data through Meta APIs."
    env_vars:
      - META_APP_ID
      - META_APP_SECRET
      - META_ACCESS_TOKEN
    recommended_scope: "Approved read-only insights/public content permissions"
    avoid: "Personal account automation, scraping login-only Instagram pages"

  tiktok_research_api:
    enabled: false
    approval_required: true
    purpose: "Read approved TikTok research data when public tag pages are insufficient."
    env_vars:
      - TIKTOK_RESEARCH_API_KEY
    recommended_scope: "Approved read-only research access"
    avoid: "Login bypass, personal account automation, scraping restricted TikTok pages"

  linkedin_api:
    enabled: false
    approval_required: true
    purpose: "Read approved company page or ad/library data where permitted."
    env_vars:
      - LINKEDIN_CLIENT_ID
      - LINKEDIN_CLIENT_SECRET
    recommended_scope: "Read-only organization data approved by LinkedIn"
    avoid: "Profile scraping, personal account automation, unsolicited messaging"

  discord_delivery:
    enabled: false
    approval_required: true
    purpose: "Send approved briefs to a team Discord channel."
    env_vars:
      - DISCORD_WEBHOOK_URL
    recommended_scope: "Single-channel incoming webhook"
    avoid: "Admin bot permissions, server-wide permissions"

  notion_content_tracker:
    enabled: false
    approval_required: true
    purpose: "Create and update approved clip production records in a single Notion database."
    env_vars:
      - NOTION_API_KEY
      - NOTION_DATABASE_ID
    recommended_scope: "Single approved Goblin Recon content database"
    avoid: "Workspace-wide access, private unrelated pages, personal account automation"

  google_sheets_content_tracker:
    enabled: false
    approval_required: true
    purpose: "Create and update approved clip production records in a single Google Sheet."
    env_vars:
      - GOOGLE_SHEETS_CREDENTIALS_JSON
      - GOOGLE_SHEETS_SPREADSHEET_ID
    recommended_scope: "Single approved spreadsheet with read/write access"
    avoid: "Drive-wide access, personal account automation, unrelated files"

  mcp_memory:
    enabled: false
    approval_required: true
    purpose: "Store approved examples, shelved examples, and recurring brand-gate decisions in optional MCP memory."
    env_vars: []
    recommended_scope: "Goblin Recon project memory only"
    avoid: "Secrets, full raw transcripts, private personal data"

  mcp_fetch:
    enabled: false
    approval_required: true
    purpose: "Extract readable text from approved public URLs."
    env_vars: []
    recommended_scope: "Public pages only"
    avoid: "Paywalls, captchas, login gates, robots.txt violations, rate-limit bypasses"

  scrapling_public_extract:
    enabled: false
    approval_required: true
    purpose: "Extract public JavaScript-heavy pages when normal extraction fails."
    env_vars: []
    recommended_scope: "Public pages only, respectful rate limits"
    avoid: "Anti-access bypasses, login-only pages, personal accounts, restricted platform surfaces"
