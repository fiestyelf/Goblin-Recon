# Goblin Recon — Social Extraction Playbook
#
# This file defines how Goblin Recon should capture social signals without
# depending on fragile or restricted scraping. It is a policy/config file, not a
# secret store. Keep API keys in `.env`, Hermes secrets, or an approved vault.

principle: "Capture social signals through approved APIs, public access, or human-assisted intake; never bypass platform restrictions."

required_output: normalized_social_record

capture_methods:
  approved_api:
    priority: 1
    use_when: "A company-approved read-only API is available."
    allowed_data: "Public posts, public metrics, public creator/channel metadata, public URLs."
    never: "Posting, liking, following, DM access, profile scraping, or personal-account automation."

  public_browser:
    priority: 2
    use_when: "The public page loads without login, captcha, paywall, or platform denial."
    allowed_data: "Visible captions, visible metrics, public URLs, visible dates, visible creator handles."
    never: "Cookie/session use, login bypass, captcha solving, rate-limit bypass, private surfaces."

  manual_assisted:
    priority: 3
    use_when: "Public extraction is blocked or the user already found promising material."
    accepted_inputs:
      - url
      - screenshot_summary
      - caption
      - visible_metrics
      - creator_handle
      - user_notes
    reason: "This keeps the workflow moving without unsafe scraping."

platforms:
  instagram:
    business_need: "Primary trend and format signal for faceless Instagram content."
    preferred_method: manual_assisted
    future_method: instagram_meta_api
    current_reality: "Public pages are often login/cookie gated and unreliable for automated extraction."
    collect:
      - creator
      - url
      - published_date
      - views
      - likes
      - comments
      - caption
      - hook
      - format_type
      - topic
      - access_status
    fallback: "Ask for URL, screenshot, caption, or visible metrics. Do not use personal login automation."

  tiktok:
    business_need: "Fastest format and viral-acceleration signal."
    preferred_method: manual_assisted
    future_method: approved_third_party_or_platform_api
    current_reality: "Public pages are JavaScript-heavy and can be inconsistent or blocked."
    collect:
      - creator
      - url
      - published_date
      - views
      - likes
      - comments
      - caption
      - hook
      - format_type
      - sound_trend
      - topic
      - access_status
    fallback: "Ask for URL, screenshot, caption, visible metrics, or creator handle."

  x_twitter:
    business_need: "Real-time validation and expert discourse."
    preferred_method: x_twitter_api
    future_method: x_twitter_api
    current_reality: "Public web access is inconsistent; approved API is cleaner."
    collect:
      - creator
      - url
      - published_date
      - likes
      - comments
      - shares
      - caption
      - topic
      - access_status
    fallback: "Use public screenshots/URLs or skip if access is blocked."

  reddit:
    business_need: "Community validation and practitioner sentiment."
    preferred_method: reddit_api
    future_method: reddit_api
    current_reality: "More reliable than IG/TikTok when read-only API access is approved."
    collect:
      - creator
      - url
      - published_date
      - likes
      - comments
      - caption
      - topic
      - access_status
    fallback: "Use public subreddit URLs if API is not configured."

  youtube:
    business_need: "Source videos and metadata for Clip Mine."
    preferred_method: public_transcript
    future_method: youtube_data_api
    current_reality: "Transcript extraction works without YouTube Data API; API helps with metadata later."
    collect:
      - creator
      - url
      - published_date
      - views
      - likes
      - comments
      - caption
      - topic
      - access_status
    fallback: "Use transcript script and visible metadata."

  linkedin:
    business_need: "B2B validation and founder/operator framing."
    preferred_method: manual_assisted
    future_method: approved_linkedin_api
    current_reality: "Profile scraping and personal account automation are not allowed."
    collect:
      - creator
      - url
      - published_date
      - likes
      - comments
      - caption
      - topic
      - access_status
    fallback: "Use approved organization/page data or manual screenshots/URLs."

normalized_social_record:
  required:
    - platform
    - url
    - topic
    - access_status
  recommended:
    - creator
    - published_date
    - views
    - likes
    - comments
    - caption
    - hook
    - format_type
    - category
    - why_it_is_trending
    - can_genx_adapt_this
    - confidence
  access_status_values:
    - api_ok
    - public_ok
    - manual_ok
    - blocked
    - partial
    - unknown

decision_rules:
  use_in_social_pulse:
    - "Source URL exists."
    - "Topic is clear."
    - "At least one signal exists: metrics, caption, hook, format, or user notes."
  move_to_clip_mine:
    - "Signal includes a usable video/source URL."
    - "Moment or topic is specific enough to search YouTube/podcasts/interviews."
  shelve:
    - "No URL."
    - "Restricted/login-only source with no manual summary."
    - "No clear topic, hook, or adaptation angle."
    - "Unverifiable sensitive claim."
