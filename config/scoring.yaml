# Goblin Recon — Scoring Configuration
# Scoring weights for all layers

# Trend Radar (Layer 1)
# Priority: Instagram → TikTok → X/Twitter → Reddit → Tech News
trend_radar:
  threshold: 60  # Minimum score to advance (out of 100)
  dimensions:
    - key: social_velocity
      max: 25
      hint: "IG views/hour or TikTok plays/hour. 100K+/hr = 25, 50K+/hr = 20, 10K+/hr = 15, 1K+/hr = 10, under = 5. This is the PRIMARY signal — catches things GOING viral on social."
    - key: recency
      max: 15
      hint: "Published in last 24h = 15, 48h = 12, 72h = 8, older = 0"
    - key: cross_source
      max: 15
      hint: "1 source = 5, 2 sources = 10, 3+ sources = 15. IG + X = confirmed."
    - key: controversy
      max: 10
      hint: "Polarized comments, opposing takes, heated debate. Look for comment sections on fire."
    - key: format_stealability
      max: 10
      hint: "Can the reel format be adapted for GenX content? Is the hook style replicable? Does the structure work for faceless?"
    - key: genx_relevance
      max: 10
      hint: "Would GenX B2C/B2B audiences care about this at a human level?"
    - key: brand_alignment
      max: 15
      hint: "Fits B2C science+soul or B2B results-not-advice positioning; no hype/woo/corporate filler. Passes brand gate."
  instagram_specific:
    min_views_for_signal: 50000
    extract_hook_style: true
    extract_format_type: true
    track_creator_growth: true
  tiktok_specific:
    min_plays_for_signal: 100000
    extract_sound_trend: true
    extract_format_innovation: true

  # ── Acceleration Scoring ──
  # Velocity alone is misleading. A story at 155% above baseline looks hot,
  # but if it was at 250% last window, acceleration is -0.95 — it's PEAKING not GROWING.
  # Sources: neelmanivispute/trends-engine velocity+acceleration algorithm.
  acceleration:
    enabled: true
    weight: 0.4  # 60% velocity + 40% acceleration in combined score
    min_engagement_floor: 1000  # Stories below this get zero acceleration weight
    lifecycle_states:
      - BASELINE   # Below thresholds or floor. Monitor, don't act.
      - EMERGING   # Fresh + accelerating. BEST TIME TO SOURCE CLIPS.
      - GROWING    # Strong velocity + positive acceleration. Good for analytical.
      - PEAKING    # High velocity but decelerating. Clip if unique, otherwise skip.
      - DECLINING  # Past peak. Skip unless take is timeless.
      - VIRAL      # Very high velocity regardless. Confirm with 2+ sources.

  # ── Diversity Enforcement ──
  # Prevents single-domain dominance. Without this, high-activity domains
  # (AI/ML) dominate and the report misses contrarian or research signals.
  # Source: 0xrdan/topic-discovery round-robin algorithm.
  diversity:
    enforce: true
    min_source_domains: 3         # Top 5 must include at least 3 unique source types
    max_per_domain: 3             # No single domain contributes more than 3 to the set
    domain_weights:               # Priority for round-robin selection
      instagram: 1.0
      tiktok: 0.9
      x_twitter: 0.8
      youtube: 0.7
      reddit: 0.6
      tech_news: 0.5
      hacker_news: 0.5
      github: 0.4
      arxiv: 0.3
    blocked_domain_behavior: "Expand remaining domains proportionally. Never reduce output below 3 stories."

# Source Hunter (Layer 2)
source_hunter:
  threshold: 65
  dimensions:
    - key: topic_match
      max: 20
      hint: "Title + description match story keywords."
    - key: recency
      max: 15
      hint: "How old? Last 7 days = 15, 14 days = 10, 30 days = 5"
    - key: credibility
      max: 20
      hint: "Channel size + authority + consistency. Verified badge counts."
    - key: clip_potential
      max: 15
      hint: "Does it have quotable moments? Clear soundbites?"
    - key: engagement_ratio
      max: 10
      hint: "Views per hour since publish. Social velocity."
    - key: brand_voice_fit
      max: 15
      hint: "Creator tone aligns with GenX voice; penalize hype, fake urgency, woo, advice-merchant tone."
    - key: format_reusability
      max: 5
      hint: "Can the video's format/structure be adapted for GenX content? Bonus for clear hooks, text overlays, or comparison formats."
  source_priority:
    - youtube_podcast
    - instagram_reel
    - tiktok
    - podcast_audio

# Moment Finder (Layer 3)
moment_finder:
  min_score: 60
  dimensions:
    - key: scroll_stop
      max: 15
      hint: "THE test. Would someone stop scrolling for this? Visual + audio + hook combined. This is the #1 dimension for social content."
    - key: quotability
      max: 20
      hint: "Would someone quote this in a meeting? Would it work as a text overlay?"
    - key: emotion
      max: 15
      hint: "Does it evoke strong reaction? Fear, awe, anger, excitement, curiosity."
    - key: clarity
      max: 15
      hint: "Is the point clear without context? Can someone understand it in 3 seconds?"
    - key: controversy
      max: 10
      hint: "Does it challenge conventional thinking? Would people argue in comments?"
    - key: visual_potential
      max: 10
      hint: "Can it be made into a faceless reel with text overlay and stock footage?"
    - key: brand_alignment
      max: 15
      hint: "Moment expresses B2C science+soul/truly-seen or B2B implementation/results-not-advice."
  clip_duration:
    min: 15
    max: 60
    optimal: 30

# Brand Gate
brand_gate:
  min_brand_score: 8  # out of 15
  blacklist_auto_shelve: true
  require_brand_angle: true
  allowed_brand_angles:
    - B2C
    - B2B
    - Both
  source_files:
    - memory/brand-rules.md
    - config/brand-voice.yaml

# Clip Rules
clip_rules:
  min_duration: 15  # seconds
  max_duration: 60  # seconds
  optimal_duration: 30  # seconds

# Format Quality (for trend reports)
format_quality:
  winning_formats:
    - x_vs_y_comparison:
        hook: "Which [X] is the most [Y]?"
        works_for: "AI model comparisons, tool comparisons, timeline contrasts"
        visual: "Side-by-side clips or split screen"
    - shocking_stat:
        hook: "[Number]% of [thing] is now [surprising fact]"
        works_for: "Data-driven stories, industry shifts"
        visual: "Animated counters, text reveal"
    - they_dont_want_you_to_know:
        hook: "How [group] is secretly [action]"
        works_for: "Exposé, industry manipulation, hidden practices"
        visual: "Screenshots, documents, dramatic text reveals"
    - celebrity_controversy:
        hook: "[Famous person] just [controversial AI action]"
        works_for: "Celebrity AI adoption, Hollywood AI debates"
        visual: "Celebrity clips + AI-generated content side-by-side"
    - mind_blowing_science:
        hook: "This [thing] has no [critical component] but can [amazing feat]"
        works_for: "Robotics, AI breakthroughs, research papers"
        visual: "Lab footage, robot demos, microscope imagery"
    - student_versus_system:
        hook: "[Regular person] used [AI tool] and made [impressive result]"
        works_for: "Democratization stories, tool tutorials"
        visual: "Before/after, process montage, result reveal"
    - quote_card:
        hook: "[Authority figure]: '[provocative quote]'"
        works_for: "CEO interviews, research paper quotes, predictions"
        visual: "Text overlay on stock footage or interview clips"
