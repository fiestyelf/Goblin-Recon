# ── Source Kind Reference ──
#
# homepage   — Main landing page: positioning, narrative, hero copy    [🔴 Critical]
# pricing    — Pricing page: plan changes, tier restructuring          [🔴 Critical]
# blog       — Blog index: content velocity, topic shifts, launches    [🟡 High]
# changelog  — Product changelog: feature releases, deprecations       [🟡 High]
# jobs       — Careers page: hiring signals, growth direction          [🟢 Signal]
# docs       — Documentation: API changes, new capabilities            [🟢 Signal]
# about      — About page: team growth, mission shifts                 [🟢 Signal]
# events     — Events page: webinars, conferences, launches            [🟢 Signal]
# press      — Press/media page: credibility moves, announcements      [🟢 Signal]
# podcast    — Podcast page: thought leadership, audience building     [🟢 Signal]
# other      — Custom page: specify with label                         [🟢 Signal]
#
# Priority determines scrape order and report prominence.
# 🔴 Critical pages are always scraped. 🟡 High are scraped on standard scans.
# 🟢 Signal pages are scraped only on deep scans.
