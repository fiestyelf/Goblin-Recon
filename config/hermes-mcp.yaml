# MCP Server Configuration for Goblin Recon
# Portable — no hardcoded paths. Run setup-mcp.sh to install.
#
# These servers are activated by Hermes at gateway/chat startup.
# API keys are loaded from .env in the project root (bash servers source it).
# npx/uvx servers auto-install their packages on first run.
#
# === REFERENCE ===
# The full server list (active + optional) is in mcp.json at project root.
# This file mirrors the "active" subset that passes the startup health check.

mcp_servers:
  # --- Knowledge graph memory (no API key needed) ---
  memory:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-memory"]
    timeout: 30

  # --- YouTube transcript extraction (no API key needed) ---
  youtube-transcript:
    command: npx
    args: ["-y", "@kimtaeyoon83/mcp-server-youtube-transcript"]
    timeout: 30

  # --- Semantic search (requires EXA_API_KEY in .env) ---
  exa:
    command: bash
    args:
      - -lc
      - set -a; source ./.env 2>/dev/null; set +a; exec npx -y mcp-remote@latest "https://mcp.exa.ai/mcp?exaApiKey=${EXA_API_KEY}"
    timeout: 30

  # --- AI-optimised web search (requires TAVILY_API_KEY in .env) ---
  tavily:
    command: bash
    args:
      - -lc
      - set -a; source ./.env 2>/dev/null; set +a; exec npx -y tavily-mcp@latest
    timeout: 30

  # --- Public web page → clean markdown (requires FIRECRAWL_API_KEY in .env) ---
  firecrawl:
    command: bash
    args:
      - -lc
      - set -a; source ./.env 2>/dev/null; set +a; exec npx -y firecrawl-mcp@latest
    timeout: 30

  # --- AI-powered structured extraction (requires SCRAPEGRAPH_API_KEY in .env) ---
  scrapegraph:
    command: bash
    args:
      - -lc
      - set -a; source ./.env 2>/dev/null; set +a; exec npx -y mcp-remote@latest https://scrapegraph-mcp.onrender.com/mcp --header "X-API-Key:${SCRAPEGRAPH_API_KEY}"
    timeout: 30
