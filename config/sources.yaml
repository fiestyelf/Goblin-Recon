# Goblin Recon — Source Configuration
# Where the trend radar looks for stories
#
# SOCIAL-NATIVE PRIORITY ORDER: Instagram → TikTok → X/Twitter → Reddit → Tech News
# Social platforms drive engagement. News sites provide validation.

scan_modes:
  fast_scan:
    purpose: "Low-stress daily discovery using reliable sources first."
    use_when: "Daily check-ins, quick trend candidates, low manual overhead."
    primary_sources: [youtube, reddit, tech_news, product_hunt]
    optional_sources: [x_twitter, hacker_news]
    avoid_by_default: [instagram, tiktok]
    output: "5-10 ranked trend/content candidates with confidence and next action."

  deep_social_scan:
    purpose: "Social-native discovery for hooks, formats, and viral signals."
    use_when: "Weekly research, important launches, or explicit social trend requests."
    primary_sources: [instagram, tiktok]
    validation_sources: [x_twitter, reddit, tech_news]
    blocked_source_behavior: "Mark access_status=blocked and continue; do not bypass restrictions."
    output: "Ranked social signals with hooks, format types, metrics, confidence, and adaptation notes."

  manual_assisted_scan:
    purpose: "Turn human-provided URLs, screenshots, captions, handles, or notes into scored signals."
    use_when: "Public platforms block extraction or the user already found promising material."
    accepted_inputs: [url, screenshot, caption, creator_handle, user_notes]
    output: "Normalized social record plus recommendation: use in Social Pulse, move to Clip Mine, or shelve."

  signal_scan:
    purpose: "First-mover discovery before mainstream news validates a story."
    use_when: "The team needs early AI stories, developer signals, repo velocity, or paper/product leads."
    time_gate_hours: 6
    primary_sources: [x_twitter, hacker_news, github_trending, arxiv]
    fallback_sources: [reddit, tech_news]
    blocked_source_behavior: "Mark access_status=blocked and continue; do not bypass restrictions."
    no_signal_behavior: "Return 'nothing worth posting right now' instead of forcing weak ideas."
    output: "Early-signal candidates with source URLs, published dates, velocity notes, confidence, and next action."

api_placeholders:
  brave_search:
    status: not_configured
    env_var: BRAVE_SEARCH_API_KEY
    purpose: "Optional web search acceleration. Do not require for local use."
  google_custom_search:
    status: not_configured
    env_var: GOOGLE_CUSTOM_SEARCH_API_KEY
    purpose: "Optional fallback search provider. Do not require for local use."
  youtube_data_api:
    status: not_configured
    env_var: YOUTUBE_DATA_API_KEY
    purpose: "Optional YouTube search and metadata fallback. Transcript extraction still uses public captions first."
  reddit_api:
    status: not_configured
    env_var: REDDIT_CLIENT_ID
    purpose: "Optional OAuth access when public Reddit is blocked."
  instagram_graph_api:
    status: not_configured
    env_var: INSTAGRAM_GRAPH_API_TOKEN
    purpose: "Optional approved API access. Never use personal login automation."
  tiktok_research_api:
    status: not_configured
    env_var: TIKTOK_RESEARCH_API_KEY
    purpose: "Optional approved research API access. Never bypass login walls."

normalized_social_record:
  fields:
    - platform
    - creator
    - url
    - published_date
    - views
    - likes
    - comments
    - caption
    - hook
    - format_type
    - topic
    - category
    - why_it_is_trending
    - can_genx_adapt_this
    - confidence
    - access_status

social_extraction_policy:
  reliability_ladder:
    - approved_api_or_reliable_public_feed
    - public_browser_extraction
    - manual_assisted_input
  stop_conditions:
    - login_required
    - paywall
    - captcha
    - robots_txt_denial
    - rate_limit_block
    - platform_access_denied
  blocked_behavior: "Set access_status=blocked and switch to manual assisted input only if the missing data is essential."

sources:

  # ── FAST SCAN: YOUTUBE (Reliable Public Video/News Leads) ──
  youtube:
    priority: fast_scan_primary
    reason: "Reliable public source for AI news explainers, podcasts, interviews, and clip leads."
    search_queries:
      - "AI news today"
      - "AI agents podcast"
      - "OpenAI latest interview"
      - "Anthropic Claude update"
      - "AI startup interview"
    preferred_source_types:
      - podcast
      - interview
      - keynote
      - explainer
    extract: ["title", "channel", "url", "published_date", "views", "duration"]

  # ── LAYER 1A: INSTAGRAM (Primary Trend Detection) ──
  instagram:
    priority: 1
    reason: "Highest engagement density for AI content. Creator-driven, format-visible."
    hashtags:
      - ainnews
      - artificialintelligence
      - aitools
      - aiupdates
      - technews
      - machinelearning
      - generativeai
      - ainews
    creator_accounts:
      - handle: therundownai
        followers: 491000
        type: news_digest
        format: carousel_slides
        notes: "Daily AI news digest. Carousel format. High consistency."
      - handle: rowancheung
        followers: 418000
        type: interview_clips
        format: reels
        notes: "Exclusive AI leader interviews. Clip-based. Premium sourcing."
      - handle: inflecta.ai
        followers: null
        type: narrative_storytelling
        format: reels
        notes: "Narrative AI stories. High viral potential. 'Student made $238K' format."
      - handle: ankitgupta.ai
        followers: null
        type: ai_tools
        format: reels
        notes: "AI tool showcases. 'Content systems not creation' angle."
      - handle: ai_for_success
        followers: 70000
        type: ai_tips
        format: reels
        notes: "AI tips and tools for productivity."
      - handle: dailyaibrief
        followers: null
        type: news
        format: reels
        notes: "Daily AI news briefs."
      - handle: aaboroshke
        followers: null
        type: commentary
        format: reels
        notes: "AI commentary and analysis."
    scrape_rules:
      public_only: true
      no_login_bypass: true
      respect_rate_limits: true
      max_profiles_per_scan: 5
      extract: ["caption", "hashtags", "view_count", "likes", "format_type", "hook_style"]

  # ── LAYER 1B: TIKTOK (Secondary Trend Detection) ──
  tiktok:
    priority: 2
    reason: "Fastest viral acceleration. Format innovation originates here."
    hashtags:
      - ainnews
      - artificialintelligence
      - aiexplained
      - technews
      - aitools
      - machinelearning
      - aibreakthrough
    creator_accounts:
      - handle: "@ainews"
        type: news_aggregator
      - handle: "@tech_tok"
        type: tech_news
      - handle: "@futurepedia"
        type: ai_tools
      - handle: "@mreflow"
        type: ai_workflow
    search_queries:
      - "AI news today"
      - "AI breakthrough 2026"
      - "AI tool that will blow your mind"
      - "AI replaces jobs"
      - "Claude vs ChatGPT"
    scrape_rules:
      public_only: true
      respect_rate_limits: true
      extract: ["caption", "hashtags", "play_count", "format", "sound_trend"]

  # ── LAYER 1C: X/TWITTER (Validation + Velocity Check) ──
  x_twitter:
    priority: 3
    reason: "Real-time validation. Check if IG/TikTok trends are also breaking on X."
    queries:
      - "AI agent"
      - "LLM news"
      - "GPT update"
      - "Claude AI"
      - "open source AI"
      - "AI startup"
      - "machine learning"
      - "generative AI"
    accounts_to_monitor:
      - "@OpenAI"
      - "@AnthropicAI"
      - "@GoogleDeepMind"
      - "@MetaAI"
      - "@MistralAI"
      - "@ylecun"
      - "@sama"
      - "@kaboroshke"

  # ── LAYER 1D: REDDIT (Community Sentiment) ──
  reddit:
    priority: 4
    reason: "Community validation. What are actual practitioners discussing?"
    subreddits:
      - artificial
      - singularity
      - MachineLearning
      - LocalLLaMA
      - ChatGPT
      - ClaudeAI
    sort: hot
    min_upvotes: 100

  # ── LAYER 1E: TECH NEWS (Source Verification) ──
  tech_news:
    priority: 5
    reason: "Verify IG/TikTok trends against credible journalism. Add publication dates + URLs."
    sites:
      - name: TechCrunch
        url: https://techcrunch.com/category/artificial-intelligence/
      - name: The Verge
        url: https://www.theverge.com/ai-artificial-intelligence
      - name: VentureBeat
        url: https://venturebeat.com/ai/
      - name: Ars Technica
        url: https://arstechnica.com/ai/

  # ── LAYER 1F: PRODUCT HUNT (Tool/Product Trends) ──
  product_hunt:
    priority: 6
    reason: "What AI tools are launching? Tool trends → content angles."
    topics:
      - artificial-intelligence
      - agents
    timeframe: last_24_hours

  # ── FAST SCAN: HACKER NEWS (Developer/Builder Signal) ──
  hacker_news:
    priority: fast_scan_optional
    reason: "Public builder sentiment and early technical discussion. Treat as validation, not primary social velocity."
    urls:
      - https://news.ycombinator.com/
      - https://hn.algolia.com/?q=AI
    search_terms:
      - AI
      - LLM
      - agents
      - OpenAI
      - Anthropic
    extract: ["title", "url", "points", "comments", "published_date"]

  # ── SIGNAL SCAN: GITHUB TRENDING (Repository Velocity) ──
  github_trending:
    priority: signal_scan_primary
    reason: "Repo velocity can reveal AI tools before they reach mainstream tech press."
    urls:
      - https://github.com/trending
      - https://github.com/trending/python?since=daily
      - https://github.com/trending/javascript?since=daily
    filters:
      languages: [python, javascript, typescript]
      topics: [ai, llm, agents, machine-learning, generative-ai]
      timeframe: daily
    extract: ["repo", "url", "description", "stars_today", "language", "topics"]

  # ── SIGNAL SCAN: ARXIV (Research-to-Product Leads) ──
  arxiv:
    priority: signal_scan_primary
    reason: "Fresh papers can become product and content angles before news coverage catches up."
    urls:
      - https://arxiv.org/list/cs.AI/recent
      - https://arxiv.org/list/cs.CL/recent
      - https://arxiv.org/list/cs.LG/recent
    categories: [cs.AI, cs.CL, cs.LG]
    timeframe: last_24_hours
    extract: ["title", "url", "authors", "abstract", "published_date", "category"]
