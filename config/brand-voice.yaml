visual_identity:
  b2b:
    colors: "Deep/forest green base with restrained gold accent."
    style: "Grounded, intelligent, premium, proof-forward, zero decoration."
  b2c:
    colors: "Terracotta, clay, cream, sand, golden warmth, warm charcoal, espresso."
    style: "Cinematic, warm, film-grain, lamplit, editorial, typography-led."
  never:
    - pinks
    - blues
    - clinical brightness
    - bright corporate blue
    - bright red
    - stock-photo cheesiness
    - hustle-bro thumbnail energy
    - generic coaching funnel
