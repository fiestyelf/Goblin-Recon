# GenX brand voice configuration for Goblin Recon.

brand_architecture:
  separate_front_doors: true
  language: english_only
  b2c_current_name: "Dr. Sara Hegy / B2C brand"
  b2b_name: "GenX Academy"
  open_decisions_must_not_be_guessed: true

positioning:
  b2c: "Real science and real soul. Transformation that makes people feel truly seen. No woo, no hype."
  b2b: "Consulting is the delivery of results: practical implementation, not opinions. Operators, not advisors."

voice:
  b2c:
    allowed_traits:
      - alive
      - awakening
      - limitless
      - soulful-but-grounded
      - warm
      - playful
      - emotionally true
      - truly seen
    never:
      - woo
      - above-the-clouds
      - too soft
      - too nice
      - too pleasing
      - solemn
      - reverent
      - self-serious
    rule: "Depth plus play, never depth plus preciousness."
  b2b:
    allowed_traits:
      - rigorous
      - no-BS
      - science-backed
      - human-centric
      - powerful
      - structural
      - provocative
      - grounded
    never:
      - advice-merchant
      - desperate-salesy
      - unsoulful
      - generic
      - hustle-bro
    rule: "Keep the provocative edge; it qualifies the right client."

brand_gate:
  min_brand_score: 8
  max_brand_score: 15
  blacklist_auto_shelve: true
  quoted_source_exception: true
  require_brand_angle: true
  allowed_brand_angles:
    - B2C
    - B2B
    - Both
  nuance_words:
    - limitless
    - alive
    - awakening
    - transform
  nuance_rule: "Allowed only with specific before/after proof, client language, or concrete transformation."

caption_tones:
  default_behavior:
    first_output: professional_genx
    ask_after_default: true
    prompt: "Would you like a different version: casual, edgy, warm, wry, curious, reflective, analytical/data-driven, bold, or more platform-native?"
    brand_gate_required: true
    skill_path: skills/caption-tone/SKILL.md
  tones:
    professional_genx:
      voice: "Clear, grounded, operator-led, polished without sounding corporate."
      best_for: [default, b2b_linkedin, first_draft, source_briefs]
      guardrails: [no_hype, no_generic_advice, no_blacklist_terms]
    direct:
      voice: "Facts first, minimal adjectives, decision-ready."
      best_for: [latest_ai_news, b2b_linkedin, newsjacking]
      guardrails: [avoid_cold_or_flat, include_clear_stakes]
    wry:
      voice: "Knowing, dry, lightly sardonic, never mean."
      best_for: [controversial_polarizing, platform_commentary]
      guardrails: [no_jokes_at_people, no_punching_down]
    warm:
      voice: "Human, emotionally true, grounded, not precious."
      best_for: [b2c_instagram, identity_content, transformation_with_proof]
      guardrails: [no_woo, no_soft_generic_comfort]
    curious:
      voice: "Question-led, analytical, invites thoughtful replies."
      best_for: [upgrade_democratization, analytical_deep_dive, carousels]
      guardrails: [no_vague_questions, anchor_to_specific_evidence]
    reflective:
      voice: "Thoughtful, grounded, inward-looking, and emotionally precise without becoming precious."
      best_for: [identity_content, transformation_with_proof, b2c_instagram, thought_leadership]
      guardrails: [no_woo, no_navel_gazing, anchor_to_specific_proof]
    analytical_data:
      voice: "Evidence-led, numbers-first, clear about what the data proves and what it does not."
      best_for: [analytical_deep_dive, b2b_linkedin, latest_ai_news, reports]
      guardrails: [no_dry_recitation, include_human_stakes, no_cherry_picked_stats]
    bold:
      voice: "Provocative, takes a position, gives the audience something to react to."
      best_for: [controversial_polarizing, predictions, strong_opinions]
      guardrails: [no_false_certainty, no_clickbait, support_claims_with_sources]
    casual_edgy:
      voice: "Looser, sharper, social-native, still intelligent."
      best_for: [instagram_reels, tiktok, threads, experimental_posts]
      guardrails: [no_cringe_slang, no_hustle_bro, no_blacklist_terms]
  default_by_category:
    latest_ai_news: direct
    controversial_polarizing: bold
    upgrade_democratization: curious
    analytical_deep_dive: analytical_data
  platform_defaults:
    instagram_reels: professional_genx
    instagram_carousel: curious
    tiktok: casual_edgy
    threads: wry
    facebook: warm
    facebook_group: warm
    youtube_shorts: direct
    linkedin: professional_genx

