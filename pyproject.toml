[project]
name = "goblin-recon"
version = "0.1.0"
description = "Hermes agent assets and importable Python tools for AI trend research and content briefing."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.12.3",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "youtube-transcript-api==1.2.4",
  "yt-dlp>=2026.3.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goblin_recon*"]
